name: CI
on: [push, pull_request]
jobs:
  security-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Source security baseline
        run: python scripts/security_gate.py

  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNEXVARY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Release smoke (Unix)
        if: runner.os != 'Windows'
        run: |
          ./build/nexvary_avionics_lab --profile configs/nominal.profile.json --export-json build/nominal-session.json --report-json build/nominal-report.json --report-md build/nominal-report.md --diagnostic-json build/nominal-diagnostic.json --diagnostic-md build/nominal-diagnostic.md --diagnostic-casebook build/nominal-casebook.json --diagnostic-summary
          ./build/nexvary_avionics_lab --inspect-json build/nominal-session.json
          ./build/nexvary_release_manifest build/release-manifest.json
          python scripts/verify_release.py build/nominal-session.json build/nominal-report.json build/nominal-report.md
          python scripts/verify_diagnostics.py build/nominal-diagnostic.json build/nominal-diagnostic.md build/nominal-casebook.json
          python scripts/verify_manifest.py build/release-manifest.json
      - name: Release smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build/Release/nexvary_avionics_lab.exe --profile configs/nominal.profile.json --export-json build/nominal-session.json --report-json build/nominal-report.json --report-md build/nominal-report.md --diagnostic-json build/nominal-diagnostic.json --diagnostic-md build/nominal-diagnostic.md --diagnostic-casebook build/nominal-casebook.json --diagnostic-summary
          ./build/Release/nexvary_avionics_lab.exe --inspect-json build/nominal-session.json
          ./build/Release/nexvary_release_manifest.exe build/release-manifest.json
          python scripts/verify_release.py build/nominal-session.json build/nominal-report.json build/nominal-report.md
          python scripts/verify_diagnostics.py build/nominal-diagnostic.json build/nominal-diagnostic.md build/nominal-casebook.json
          python scripts/verify_manifest.py build/release-manifest.json

  sanitizers-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure sanitizers
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DNEXVARY_ENABLE_SANITIZERS=ON -DNEXVARY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-san -j2
      - name: Test with ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure

  qt-hmi-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - name: Configure Qt HMI
        run: cmake -S . -B build-qt -DCMAKE_BUILD_TYPE=Release -DNEXVARY_BUILD_QT_HMI=ON -DNEXVARY_WARNINGS_AS_ERRORS=ON
      - name: Build Qt configuration
        run: cmake --build build-qt --config Release
      - name: Run tests with Qt configuration
        run: ctest --test-dir build-qt --output-on-failure
      - name: Back navigation functional smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ./build-qt/nexvary_avionics_hmi --navigation-smoke --language ar
      - name: Headless QML smoke test - all locales
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          for lang in ar en tr es de it fr ur fa ru; do
            ./build-qt/nexvary_avionics_hmi --smoke --language "$lang"
          done
      - name: Capture Stage 1800 visual air picture and RF UI release gate
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-desktop-1920x1080.png --page 0 --aircraft-profile generic-jet --width 1920 --height 1080
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-large-2560x1440.png --page 0 --aircraft-profile generic-jet --width 2560 --height 1440
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-air-picture-ar.png --page 11 --language ar --aircraft-profile generic-jet --width 1920 --height 1080
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-air-picture-en.png --page 11 --language en --aircraft-profile generic-uav --width 1920 --height 1080
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-air-picture-large.png --page 11 --language en --aircraft-profile generic-helicopter --width 2560 --height 1440
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-diagnostic-ar.png --page 9 --language ar --width 1920 --height 1080
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-air-force-management-ar.png --page 12 --language ar --width 1920 --height 1080
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-air-force-management-en.png --page 12 --language en --width 1920 --height 1080
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-about-system-ar.png --page 13 --language ar --width 1920 --height 1080
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-about-us-ar.png --page 14 --language ar --width 1920 --height 1080
          ./build-qt/nexvary_avionics_hmi --screenshot build-qt/stage1800-about-us-en.png --page 14 --language en --width 1920 --height 1080
          for lang in ar en tr es de it fr ur fa ru; do
            ./build-qt/nexvary_avionics_hmi --screenshot "build-qt/stage1800-lang-${lang}.png" --page 11 --language "$lang" --width 1720 --height 1000
          done
          python scripts/verify_ui_release_gate.py build-qt
      - uses: actions/upload-artifact@v4
        with:
          name: nexvary-avionics-stage1800-air-picture-rf-ui-release-gate
          path: build-qt/stage1800-*.png
          if-no-files-found: error
