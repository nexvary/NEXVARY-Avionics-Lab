name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: ./build/nexvary_avionics_lab --scenario power-transient --ticks 25 --replay
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/nexvary_avionics_lab.exe --scenario power-transient --ticks 25 --replay
