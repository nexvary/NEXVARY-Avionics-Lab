name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Smoke test (Unix)
        if: runner.os != 'Windows'
        run: ./build/nexvary_avionics_lab --scenario power-transient --ticks 25 --replay
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/nexvary_avionics_lab.exe --scenario power-transient --ticks 25 --replay

  qt-hmi-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript
      - name: Configure Qt HMI
        run: cmake -S . -B build-qt -DCMAKE_BUILD_TYPE=Release -DNEXVARY_BUILD_QT_HMI=ON
      - name: Build Qt configuration
        run: cmake --build build-qt --config Release
      - name: Run core tests with Qt configuration
        run: ctest --test-dir build-qt --output-on-failure
      - name: Headless QML smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ./build-qt/nexvary_avionics_hmi --smoke
